[package]
name = "hoja-portal"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A desktop portal backend that opens and saves files with Hoja"

# Not a part of Hoja. It speaks the desktop portal's D-Bus protocol for the
# file chooser, and for each request starts `hoja --pick`, which reads the
# request as JSON on stdin and writes its answer on stdout. Hoja never links
# it or knows it is there: the D-Bus code stays out of the file manager, and
# `hoja --pick` stays a plain command that a script can use too.
#
# Every dependency is already in the workspace's graph at these versions.
[dependencies]
# The async-io backend, which gpui's crates already build. The default
# features would add the blocking API too.
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
async-process = "2"
async-channel = "2"
futures-lite = "2"
serde_json = "1"
