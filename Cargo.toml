[workspace]
members = ["hoja-transfer", "hoja-drag"]

[package]
name = "hoja"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A GPU-accelerated file manager with splittable panes"

# Pinned to a specific zed revision. Safe to pin by `rev` here only because gpui is
# our sole git source: nothing else in the graph depends on it, so there is no
# source-unification hazard. Bump deliberately; `main` moves daily.
#
# Every crate below must come from the same source — patching only some yields
# two incompatible copies of `gpui`.
#
# This was briefly a fork of ours, because gpui passes `None` for
# `wl_data_device.start_drag`'s icon argument, so a drag carries nothing under
# the cursor once it leaves the window. The fork filled that argument in and made
# things worse: two chips, drawn by two unrelated pieces of code, disagreeing
# about position most of all.
#
# It turned out not to be needed. `hoja-drag` starts the drag itself, from a
# second backend on this connection, and draws the chip for the whole gesture.
# The thing that made the fork look unavoidable was the serial `start_drag`
# demands, which gpui keeps private — but binding `wl_seat` a second time gives
# us our own pointer and our own serials, and the compositor accepts those. See
# that crate's header before assuming any of this has to move in here.
#
# `gpui_platform` is mandatory and not published on crates.io: since the Feb 2026
# split, `gpui` holds the framework and platform traits while the actual backends
# live behind this facade. `gpui::Application` has no `new()`.
#
# The `wayland` feature is NOT optional. gpui_platform's default feature set is
# empty and the workspace pulls gpui_linux with default-features = false, so
# without it `current_platform()` compiles fine and then hits an `unreachable!()`
# at startup. `font-kit` alone is a macOS-only no-op on Linux.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e", features = [
    "wayland",
    "x11",
] }

# GPL-3.0-or-later, which is why this crate is too. `theme` became genuinely
# standalone in Mar 2026 (its settings dependency was inverted behind a
# `ThemeSettingsProvider` trait we simply never register).
theme = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
file_icons = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
theme_settings = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }
fuzzy_nucleo = { git = "https://github.com/zed-industries/zed", rev = "c7bea343838f42b4c14151393e41f0bbe033c95e" }

hoja-transfer = { path = "hoja-transfer" }
# Owns the outbound Wayland drag so the chip that leaves the window is ours.
hoja-drag = { path = "hoja-drag" }
# Not re-exported by gpui, so the version must match the one gpui links or the
# HasWindowHandle impl on gpui::Window is a different trait to ours.
raw-window-handle = "0.6"

anyhow = "1"
# Held below 8.12 for zed's sake, not ours. From 8.12, with the `compression`
# feature that zed turns on, `RustEmbed` has a required `compressed` method,
# and zed's hand-written `fs_embed!` impl in `util` does not provide it, so
# `settings` stops compiling. zed's own lockfile is at 8.11.0. Lift the cap
# when a bump of the zed crates compiles against a newer one.
rust-embed = ">=8.11, <8.12"
# Lenient JSON: hand-edited themes routinely carry comments and trailing commas.
# Already in the tree through the Zed crates; declared so the settings types
# can derive rather than being parsed by hand.
serde = { version = "1", features = ["derive"] }
serde_json_lenient = "0.2"
notify = "8"
# Browsing a zip. `default-features = false` is load-bearing: the defaults pull
# aes, bzip2, deflate64, lzma, ppmd, xz and zstd, and of ~50k entries across the
# 127 zip files on a real machine, 39616 were deflate, 10640 stored, and 7 zstd
# in a test fixture inside a cargo registry. Deflate alone is the format.
#
# Two crates more to compile: zip and, since zip 9, `typed-path`. Its other
# dependencies (crc32fast, flate2, getrandom, indexmap, libc, memchr, nix) are
# already in the tree through the Zed crates.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Browsing a tarball. One crate: `filetime`, `libc` and `xattr` are already here.
tar = "0.4"
# The four codecs a tarball comes wrapped in, all pure Rust and all measured
# against the C tools on real files from this machine:
#
#   gzip   flate2/miniz_oxide   357 MB/s   faster than the C tool
#   bzip2  libbz2-rs-sys         39 MB/s   parity, and slow by algorithm not code
#   zstd   ruzstd               260 MB/s   3.5x slower than libzstd
#   xz     lzma-rs              102 MB/s   2.6x slower than liblzma
#
# `flate2` and `bzip2` cost nothing: both are already in the tree, and `bzip2`
# 0.6 defaults to `libbz2-rs-sys` rather than binding the C library.
flate2 = "1"
bzip2 = "0.6"
ruzstd = "0.9"
lzma-rs = "0.3"
# Parallel directory walking for the pane footer's size totals. Measured on a
# 1.5M-file tree: 4.16s single-threaded against 1.09s on four threads, and no
# better beyond eight, which is what dua and dust are doing to be quick.
# Already in the graph through the Zed crates, so this adds nothing to the tree.
rayon = "1"
# flock, for the state file's read-modify-write. Already in the graph at 1.x
# through gpui's smol chain and hoja-transfer, so this is feature unification.
rustix = { version = "1.1", features = ["fs"] }
parking_lot = "0.13"
smallvec = "1"
xdg-mime = "0.4"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
unicode-segmentation = "1"

# Mirrors one line of zed's own `[patch.crates-io]`, which a dependency's
# patches do not reach. Since mid-2026 zed takes tree-sitter from git, and the
# grammar crates that `settings` pulls in (through `migrator`) ask crates.io
# for `tree-sitter-language`. Both declare `links = "tree-sitter-language"`, so
# without this the graph cannot resolve at all. Keep the rev in step with
# zed's when bumping.
[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }

[dev-dependencies]
# Real zip files for the archive tests, written to a temporary path. Already in
# the tree as hoja-transfer's dev dependency, so this adds nothing.
tempfile = "3"

[profile.dev]
# The gpui dependency tree is large; without this every debug build of a
# dependency is unusably slow to link and run.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
